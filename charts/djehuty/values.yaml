# -- djehuty image. For local testing, build from this branch and override:
#    docker build -t djehuty:dev -f docker/Dockerfile .
#    helm install ... --set image.repository=djehuty --set image.tag=dev \
#                     --set image.pullPolicy=Never
image:
  repository: ghcr.io/4turesearchdata/djehuty
  # -- Image tag. When empty, falls back to `.Chart.AppVersion` (currently
  # "26.2"). Override here to pin a different upstream djehuty version.
  tag: "26.8"
  pullPolicy: IfNotPresent

# -- Number of djehuty (writer) replicas. Keep at 1: djehuty's writes use
# per-process locks and git lives on the local /data PVC, so there is exactly
# one writer. Add read capacity with `scaling` below, not by raising this.
replicaCount: 1

# -- Optional read-scale topology. Disabled (default) → a single djehuty instance
# exactly as before. Enabled → the existing Deployment becomes the **writer**
# (writes + file downloads/thumbnails/IIIF/git + login/admin), and a pool of
# **stateless readers** serves public pages, API GETs and search. An in-cluster
# nginx **edge** routes each request to the right pool; the Ingress/Route point at
# the edge. Readers hold no state (no /data volume), so this needs **no RWX and no
# storage migration** — just add replicas. Requires the shared Valkey cache
# (`valkey.enabled: true`) so every pod sees the same cache.
scaling:
  enabled: false
  readers:
    replicaCount: 2
    # -- Autoscale the readers on CPU. When enabled, `replicaCount` is ignored
    # and a HorizontalPodAutoscaler manages the reader count.
    autoscaling:
      enabled: false
      minReplicas: 2
      maxReplicas: 6
      targetCPUUtilizationPercentage: 70
    resources: {}
  # -- The in-cluster nginx edge (reverse proxy) that routes writer vs readers.
  edge:
    image:
      # nginx's own unprivileged image (non-root, listens on 8080) so it runs
      # under OpenShift SCC / runAsNonRoot without extra config.
      repository: nginxinc/nginx-unprivileged
      tag: "1.27-alpine"
      pullPolicy: IfNotPresent
    replicaCount: 2
    resources: {}
    # -- Max upload size that passes through the edge to the writer.
    clientMaxBodySize: "5g"
    timeouts:
      proxyRead: "300s"
      proxySend: "300s"

# -- Pod-level securityContext. Empty by default so OpenShift's SCC can
# assign runAsUser/fsGroup from the namespace's range. For non-OpenShift
# clusters you can harden, e.g.:
#   runAsNonRoot: true
#   runAsUser: 7001
#   fsGroup: 7001
podSecurityContext: {}

# -- Container-level securityContext. Empty by default for the same reason.
# Reasonable hardening for non-OpenShift clusters:
#   allowPrivilegeEscalation: false
#   readOnlyRootFilesystem: false   # djehuty writes logs / venv state
#   capabilities: { drop: ["ALL"] }
securityContext: {}

service:
  type: ClusterIP
  port: 8080

# -- Ingress for exposing djehuty outside the cluster.
# Disabled by default — use `kubectl port-forward` for local testing.
ingress:
  enabled: false
  className: "nginx"             # e.g. "nginx", "traefik", "openshift"
  labels: {}                     # extra labels for the Ingress
  annotations: {}
    # nginx.ingress.kubernetes.io/proxy-body-size: "5g"   # large uploads
  hosts:
    - host: djehuty.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
    # - secretName: djehuty-tls
    #   hosts:
    #     - djehuty.example.com
  # -- cert-manager integration. When enabled, the right annotation is added
  # to the Ingress so cert-manager provisions the cert into the Secret named
  # by `ingress.tls[].secretName` (you still need to define `ingress.tls`).
  # Set EITHER clusterIssuer (cluster-scoped) OR issuer (namespaced).
  certManager:
    enabled: false
    clusterIssuer: ""    # e.g. "letsencrypt-prod"
    issuer: ""           # e.g. "internal-ca" (in this namespace)

# -- OpenShift Route (native equivalent of Ingress). Use this on OpenShift
# clusters whose router doesn't auto-translate Ingress objects.
# Don't enable both `ingress` and `route` unless you really mean it.
route:
  enabled: false
  # -- Override the Route resource's `metadata.name`. Useful when the
  # Route name is consumed by external systems (DNS records, monitoring,
  # bookmarks). When empty, defaults to `<release>-djehuty`. Only affects
  # the Route's K8s name; the Service/Deployment/etc. names are unchanged.
  name: ""
  # -- Hostname. If empty, OpenShift auto-assigns one under the cluster's
  # default app domain (e.g. djehuty-<ns>.apps.<cluster>.example).
  host: ""
  path: ""
  annotations: {}
    # haproxy.router.openshift.io/timeout: 60s
    # haproxy.router.openshift.io/balance: roundrobin
  tls:
    enabled: true
    # edge: TLS terminated at the router (default-signed cert from the
    #   router's CA — fine for staging).
    # reencrypt: re-encrypts to a TLS backend (requires destinationCACertificate).
    # passthrough: opaque TCP through to the pod's own TLS.
    termination: edge
    # Redirect | Allow | None
    insecureEdgeTerminationPolicy: Redirect
    # Provide your own cert/key/CA for `edge` or `reencrypt`. Leave empty
    # to use the router's default certificate. Ignored when certManager is enabled.
    certificate: ""
    key: ""
    caCertificate: ""
    destinationCACertificate: ""
    # -- cert-manager integration (requires the cert-manager openshift-routes
    # controller in the cluster — ask your admins). When enabled, cert-manager
    # provisions the cert for `route.host` and populates the Route's TLS
    # fields. Set EITHER clusterIssuer (cluster-scoped) OR issuer (namespaced).
    certManager:
      enabled: false
      clusterIssuer: ""    # e.g. "letsencrypt-prod"
      issuer: ""           # e.g. "internal-ca" (in this namespace)

# -- Persistent volume for djehuty's /data (cache, storage-root, git repos).
persistence:
  enabled: true
  size: 5Gi
  storageClass: ""
  # -- Access mode for the /data PVC. Empty = auto: ReadWriteOnce for a single
  # instance, ReadWriteMany when `scaling.enabled` (the writer and every reader
  # mount the same volume). Set explicitly only to force a value or to match a
  # CSI driver that spells RWX differently. Scaling needs a StorageClass that
  # provides RWX — without one the PVC never binds and the pods stay Pending
  # (a loud, obvious failure).
  accessMode: ""

# -- Non-sensitive configuration. Rendered into a ConfigMap and mounted at
# /etc/djehuty/config.json. Sensitive values use ${env:NAME} or ${file:/path}
# references that the JSON parser resolves at startup (see `.secrets`).
config:
  site-name: "Djehuty (helm)"
  site-shorttag: "helm"
  bind-address: "0.0.0.0"
  port: "8080"
  # -- Mapping of publisher names → ROR URLs. When a dataset's publisher
  # matches an entry, djehuty renders it as a link to the ROR record with
  # the ROR icon. The entry whose `name` matches `site-name` is also used
  # as the instance's own ROR URL in the RO-Crate export. Same example
  # shape as djehuty's `etc/djehuty/djehuty-example-config.json`.
  publisher-rors:
    publisher-ror:
      - name: "Djehuty (helm)"
        url: "https://ror.org/02d887280"
      - name: "Delft University of Technology"
        url: "https://ror.org/02e2c7k09"
      - name: "Eindhoven University of Technology"
        url: "https://ror.org/02c2kyt77"
  # -- Public URL. Leave empty to auto-derive: from ingress.hosts[0] when
  # ingress is enabled (https:// if ingress.tls is set, else http://), or
  # http://localhost:<service.port> otherwise.
  base-url: ""
  storage-root: "/data"
  cache-root:
    clear-on-start: "1"
    "#text": "/data/cache"
  live-reload: "0"
  debug-mode: "0"
  production: "1"
  disable-2fa: "1"
  authentication:
    orcid:
      client-id: ""
      client-secret: "${env:ORCID_CLIENT_SECRET}"
      endpoint: "https://orcid.org/oauth"

    # -- SAML 2.0 SSO via SURFconext (or any SAML IdP). The shape mirrors
    # djehuty's XML config: a `service-provider:` block describing this
    # deployment (cert/key referenced via ${file:...}, metadata with
    # organization + contact list) and an `identity-provider:` block for
    # the upstream IdP (entity-id, x509 cert, single-sign-on binding).
    # Uncomment + adapt; the SP cert/key live in the Secret as files,
    # not values.yaml.
    # saml:
    #   version: "2.0"
    #   strict: "1"
    #   debug: "0"
    #   service-provider:
    #     x509-certificate: "${file:/etc/djehuty/secrets/saml-sp-cert.pem}"
    #     private-key: "${file:/etc/djehuty/secrets/saml-sp-key.pem}"
    #     metadata:
    #       display-name: "Your repository"
    #       url: "https://data.example.org"
    #       description: "Public-facing description shown in IdP discovery UIs."
    #       logo: ""
    #       organization:
    #         name: "Your Organization"
    #         url: "https://example.org"
    #       # contact[] is a repeated <contact type="..."> in XML; the `type`
    #       # key on each entry becomes the XML attribute.
    #       contact:
    #         - type: "support"
    #           first-name: "Repository"
    #           last-name: "Support"
    #           email: "support@example.org"
    #         - type: "administrative"
    #           first-name: "Repository"
    #           last-name: "Admin"
    #           email: "admin@example.org"
    #         - type: "technical"
    #           first-name: "Tech"
    #           last-name: "Lead"
    #           email: "tech@example.org"
    #   identity-provider:
    #     entity-id: "https://engine.surfconext.nl/authentication/idp/metadata"
    #     # IdP cert is typically public; safe to inline as a single-line base64.
    #     x509-certificate: "MIIE5z...=="
    #     single-signon-service:
    #       url: "https://engine.surfconext.nl/authentication/idp/single-sign-on/key:20230503"
    #       binding: "urn:oasis:names:tc:SAML:2.0:bindings:HTTP-Redirect"

  # -- Side-loaded config fragments. Each entry mounts an existing
  # ConfigMap or Secret from the release namespace under
  # `/etc/djehuty/config.d/<refName>/` and emits an `include:` entry per
  # listed key into the rendered config.json. djehuty's config loader
  # (`src/djehuty/web/ui.py:935`) walks every `<include>` it finds and
  # merges the referenced file into the running config — same semantics
  # as the bare-VM XML `<include>...</include>` directive.
  #
  # Use this for data that lives outside the chart release cycle:
  # operator-managed quotas/privileges (regenerated nightly), branding
  # snippets, menu definitions. The chart does NOT create the referenced
  # ConfigMap/Secret — manage those out-of-band (`kubectl apply -f`,
  # external-secrets-operator, sealed-secrets, etc.).
  #
  # `keys` is required and explicit so the chart can render fully at
  # template time (no `lookup` magic, no cluster round-trip). Each key
  # becomes one file mount and one `include:` entry, in list order.
  includes: []
    # - configMap: djehuty-quotas
    #   keys: ["quotas.json"]
    # - configMap: djehuty-privileges
    #   keys: ["privileges.json"]
    # - secret: djehuty-branding
    #   keys: ["branding.json", "menu.json"]

# -- Secrets rendered into a Kubernetes Secret and exposed as env vars
# (short values) and/or file mounts (multi-line: PEMs, certs).
secrets:
  # -- Use an existing Kubernetes Secret instead of rendering one from
  # `env` / `files` below. Recommended when using sealed-secrets,
  # external-secrets-operator, vault-injector, etc. The Secret must
  # already exist in the release namespace and contain:
  #   - one key per `${env:NAME}` reference in `config` (same key names
  #     as listed under `secrets.env` below — values there are ignored)
  #   - one filename per `${file:/etc/djehuty/secrets/<filename>}`
  #     reference in `config` (filenames as listed under `secrets.files`
  #     — contents are ignored)
  # When set, `env` and `files` act as a *declaration* of the keys/files
  # the chart will wire into the pod from your existing Secret.
  existingSecret: ""

  env:
    # Map of ENV_NAME → value. Referenced from `config` via ${env:NAME}.
    # When `existingSecret` is set, values here are ignored — only the
    # key names matter (they're what the pod's env vars get bound to).
    ORCID_CLIENT_SECRET: ""
    # Valkey password (only when valkey.auth.enabled — see `valkey.auth`). The
    # key name must match `cacheBackend.passwordEnv` and the Valkey
    # `aclUsers.default.passwordKey`, so one Secret serves both sides.
    # VALKEY_PASSWORD: ""
  files: {}
    # Map of fileName → contents. Mounted at /etc/djehuty/secrets/<fileName>.
    # Reference from config via "${file:/etc/djehuty/secrets/<fileName>}".
    # When `existingSecret` is set, contents here are ignored.
    # Example:
    # repo-key.pem: |
    #   -----BEGIN PRIVATE KEY-----
    #   ...
    #   -----END PRIVATE KEY-----

# -- Run `djehuty web --initialize` via an initContainer on first install.
# Idempotent: skipped if /data/.initialized marker exists.
initialize: true

# -- RDF store configuration. djehuty needs a SPARQL endpoint to write to.
# When `virtuoso.enabled` is true, sparql-uri/sparql-update-uri are
# auto-derived from the bundled virtuoso subchart's Service. When false,
# you must set them explicitly to point at your external SPARQL store.
rdfStore:
  stateGraph: "djehuty://local"
  sparqlUri: ""        # e.g. "http://my-virtuoso.sparql:8890/sparql"
  sparqlUpdateUri: ""  # usually the same URL as sparqlUri
  # -- Run `djehuty migrate upgrade` automatically at web startup
  # (rdf-store/auto-migrate-on-boot). Keeps fresh instances usable without
  # a manual migration step; drift detection still hard-fails either way.
  # Set to false where operators want to gate schema changes manually.
  autoMigrateOnBoot: true

# -- Shared cache backend. When `valkey.enabled` is true, djehuty is configured
# to use the bundled Valkey as its cache backend; the host is auto-derived from
# the Valkey subchart's Service, so an invalidation on one djehuty instance is
# visible to all. When false, djehuty uses its on-disk file cache (the default)
# and this section is ignored.
cacheBackend:
  # -- Per-deployment Valkey keyspace namespace, so one Valkey can host several
  # deployments without their invalidations colliding. Empty = use the release name.
  deployment: ""
  # -- Optional TTL (seconds) backstop for cache entries. Empty = no expiry
  # (matches the file cache). Recommended when running multiple djehuty instances.
  ttl: ""
  # -- Env var carrying the Valkey password. When the Valkey subchart has auth
  # enabled (`valkey.auth.enabled`), djehuty's cache-backend password is set to
  # `${env:<passwordEnv>}`, resolved at startup from this env var. Bind it from a
  # Secret via `secrets.env` (below) so the same password reaches both djehuty and
  # Valkey. No effect when `valkey.auth.enabled` is false.
  passwordEnv: "VALKEY_PASSWORD"

# -- Bundled Virtuoso subchart (charts/virtuoso). Disable to use an
# externally-managed SPARQL store via `rdfStore` above. Anything under
# `virtuoso.*` is passed straight to the virtuoso subchart — see its
# values.yaml for the full schema. The fields below are the most common
# overrides; the rest fall back to virtuoso's defaults.
virtuoso:
  enabled: true
  # -- DBA password. CHANGE THIS for anything beyond a throwaway test cluster.
  dbaPassword: "dba"
  # -- Pre-loaded SPARQL permissions so djehuty can issue updates against
  # the bundled Virtuoso. Runs once on the first pod start.
  initScripts:
    001-djehuty-permissions.sql: |
      DB.DBA.RDF_DEFAULT_USER_PERMS_SET ('nobody', 7);
      DB.DBA.RDF_DEFAULT_USER_PERMS_SET ('SPARQL', 7);
      GRANT SPARQL_UPDATE TO "SPARQL";
      GRANT EXECUTE ON "DB.DBA.SPARQL_INSERT_DICT_CONTENT" TO "SPARQL";
      GRANT EXECUTE ON "DB.DBA.L_O_LOOK" TO "SPARQL";

# -- Bundled Valkey subchart (the official valkey-io/valkey chart). Provides the
# shared cache backend for multi-instance deployments; enabled by default and
# wired to djehuty via `cacheBackend` above (set `enabled: false` to fall back
# to djehuty's on-disk file cache). Anything under `valkey.*` is passed straight
# to the valkey subchart — see its values.yaml for the full schema. Valkey is a
# pure cache (the SPARQL store is the source of truth), so it runs ephemerally
# (dataStorage disabled) as a single standalone pod by default; losing it means
# a cold cache, never data loss.
valkey:
  enabled: true
  # The valkey subchart pins runAsUser/runAsGroup/fsGroup to 1000. OpenShift's
  # restricted-v2 SCC assigns those from the namespace's range and REJECTS a pod
  # that pins its own — the Deployment is created but no pod is ever admitted
  # (FailedCreate), so valkey silently never comes up. Null them so the platform
  # injects valid IDs (the rest of the hardening — drop ALL caps, no privilege
  # escalation, read-only rootfs, runAsNonRoot, RuntimeDefault seccomp — stays).
  # Matches the empty securityContext the djehuty/virtuoso pods already use here.
  podSecurityContext:
    runAsUser: null
    runAsGroup: null
    fsGroup: null
  securityContext:
    runAsUser: null
  # -- valkey.conf fragment. Eviction is mandatory: djehuty's version-bump cache
  # invalidation leaves orphaned key generations that allkeys-lru reclaims.
  valkeyConfig: |
    maxmemory 256mb
    maxmemory-policy allkeys-lru
  # -- Authentication (optional). Off by default. To require a password between
  # djehuty and Valkey, (1) put the password in a Secret key named by
  # `cacheBackend.passwordEnv` (e.g. add `VALKEY_PASSWORD` under `secrets.env`
  # below, or use `secrets.existingSecret`), and (2) enable + point Valkey at that
  # same Secret so both sides share one password:
  #
  # auth:
  #   enabled: true
  #   # The djehuty Secret that secrets.env renders (<release>-djehuty-secrets).
  #   usersExistingSecret: "{{ .Release.Name }}-djehuty-secrets"
  #   aclUsers:
  #     default:
  #       permissions: "~* &* +@all"
  #       passwordKey: "VALKEY_PASSWORD"   # must match cacheBackend.passwordEnv
  #
  # When `auth.enabled` is true the chart automatically sets djehuty's
  # cache-backend password to `${env:VALKEY_PASSWORD}`.
