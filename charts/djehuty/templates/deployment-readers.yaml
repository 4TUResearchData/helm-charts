{{- if .Values.scaling.enabled }}
{{- /*
Reader pool. Serves public pages, API GETs, search, file downloads and
thumbnails. Mounts the writer's /data (ReadWriteMany) so it can stream stored
files and read generated thumbnails; it never runs --initialize (the writer
owns first-boot and store migration). git stays on the writer (the sole git
writer), and the edge routes writes + session paths there too, so a reader only
ever writes transient boot scratch under /data — never a shared dataset or repo.
*/ -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "djehuty.readers.fullname" . }}
  labels:
    {{- include "djehuty.labels" . | nindent 4 }}
    app.kubernetes.io/component: readers
spec:
  {{- if not .Values.scaling.readers.autoscaling.enabled }}
  replicas: {{ .Values.scaling.readers.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "djehuty.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: readers
  template:
    metadata:
      labels:
        {{- include "djehuty.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: readers
      annotations:
        checksum/config: {{ include "djehuty.configJson" . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      {{- with .Values.podSecurityContext }}
      securityContext: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: djehuty
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext: {{- toYaml . | nindent 12 }}
          {{- end }}
          # Readers never initialize or migrate; the writer does. They just serve.
          command:
            - /bin/sh
            - -c
            - exec /usr/bin/djehuty web --config-file /etc/djehuty/config.json
          env:
            {{- range $k, $_ := .Values.secrets.env }}
            - name: {{ $k }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "djehuty.secretName" $ }}
                  key: {{ $k }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
              httpHeaders:
                - name: X-Forwarded-For
                  value: 127.0.0.1
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: http
              httpHeaders:
                - name: X-Forwarded-For
                  value: 127.0.0.1
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          {{- with .Values.scaling.readers.resources }}
          resources: {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/djehuty/config.json
              subPath: config.json
            - name: secret-files
              mountPath: /etc/djehuty/secrets
              readOnly: true
            - name: data
              mountPath: /data
            {{- range $idx, $inc := default (list) .Values.config.includes }}
            - name: {{ printf "config-include-%d" $idx }}
              mountPath: /etc/djehuty/config.d/{{ default $inc.secret $inc.configMap }}
              readOnly: true
            {{- end }}
      initContainers:
        {{- if .Values.virtuoso.enabled }}
        - name: wait-for-virtuoso
          image: busybox:1.36
          command:
            - sh
            - -c
            - "until nc -z {{ include "djehuty.virtuoso.fullname" . }} {{ default 8890 (dig "service" "port" 8890 .Values.virtuoso) }}; do echo waiting for virtuoso; sleep 2; done"
        {{- end }}
        {{- if .Values.valkey.enabled }}
        # Shared cache: wait for Valkey before serving (degrades to SPARQL if
        # down, so this is a clean-startup gate, not a hard dependency).
        - name: wait-for-valkey
          image: busybox:1.36
          command:
            - sh
            - -c
            - "until nc -z {{ include "djehuty.valkey.fullname" . }} {{ default 6379 (dig "service" "port" 6379 .Values.valkey) }}; do echo waiting for valkey; sleep 2; done"
        {{- end }}
        # Wait for the writer to be Ready (its Service only has endpoints once it
        # has initialized + migrated the store), so readers never serve against an
        # un-migrated store.
        - name: wait-for-writer
          image: busybox:1.36
          command:
            - sh
            - -c
            - "until nc -z {{ include "djehuty.fullname" . }} {{ .Values.service.port }}; do echo waiting for writer; sleep 2; done"
      volumes:
        - name: config
          configMap:
            name: {{ include "djehuty.fullname" . }}-config
        - name: secret-files
          secret:
            secretName: {{ include "djehuty.secretName" . }}
        # Shared /data: the writer's ReadWriteMany PVC, so readers stream stored
        # files and read thumbnails. Mounted read-write because djehuty writes
        # boot scratch here; git repos are never written by a reader (edge-routed
        # to the writer). Mirrors the writer's volume (emptyDir if no persistence).
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "djehuty.fullname" . }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- range $idx, $inc := default (list) .Values.config.includes }}
        - name: {{ printf "config-include-%d" $idx }}
          {{- if $inc.configMap }}
          configMap:
            name: {{ $inc.configMap }}
            items:
              {{- range $k := $inc.keys }}
              - key: {{ $k | quote }}
                path: {{ $k | quote }}
              {{- end }}
          {{- else }}
          secret:
            secretName: {{ $inc.secret }}
            items:
              {{- range $k := $inc.keys }}
              - key: {{ $k | quote }}
                path: {{ $k | quote }}
              {{- end }}
          {{- end }}
        {{- end }}
{{- end }}
