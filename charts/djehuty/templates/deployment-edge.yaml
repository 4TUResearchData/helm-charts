{{- if .Values.scaling.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "djehuty.edge.fullname" . }}
  labels:
    {{- include "djehuty.labels" . | nindent 4 }}
    app.kubernetes.io/component: edge
spec:
  replicas: {{ .Values.scaling.edge.replicaCount }}
  selector:
    matchLabels:
      {{- include "djehuty.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: edge
  template:
    metadata:
      labels:
        {{- include "djehuty.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: edge
      annotations:
        checksum/edge-config: {{ include (print $.Template.BasePath "/configmap-edge.yaml") . | sha256sum }}
    spec:
      {{- with .Values.podSecurityContext }}
      securityContext: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: edge
          image: "{{ .Values.scaling.edge.image.repository }}:{{ .Values.scaling.edge.image.tag }}"
          imagePullPolicy: {{ .Values.scaling.edge.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext: {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          {{- with .Values.scaling.edge.resources }}
          resources: {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: edge-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
      volumes:
        - name: edge-config
          configMap:
            name: {{ include "djehuty.edge.fullname" . }}
{{- end }}
