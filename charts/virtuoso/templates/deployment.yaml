apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "virtuoso.fullname" . }}
  labels: {{- include "virtuoso.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate  # PVC is ReadWriteOnce.
  selector:
    matchLabels: {{- include "virtuoso.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "virtuoso.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.podSecurityContext }}
      securityContext: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.restore.enabled }}
      # Native Virtuoso checkpoint restore. No-op unless an operator has
      # placed .bp file(s) in /database/restore/ and touched the marker
      # /database/restore/.pending — see chart README for the operator flow.
      initContainers:
        - name: restore
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext: {{- toYaml . | nindent 12 }}
          {{- end }}
          command:
            - /bin/sh
            - -c
            - |
              set -e
              RESTORE_DIR=/database/restore
              DB_DIR=/database
              MARKER="$RESTORE_DIR/.pending"
              if [ ! -f "$MARKER" ]; then
                echo "[restore] no pending marker; skipping"
                exit 0
              fi
              BACKUP_FILE=$(ls "$RESTORE_DIR"/*.bp 2>/dev/null | head -1)
              if [ -z "$BACKUP_FILE" ]; then
                echo "[restore] ERROR: marker present but no .bp file in $RESTORE_DIR"
                exit 1
              fi
              # backups look like prefix#1.bp prefix#2.bp …; strip trailing digits + .bp
              PREFIX=$(basename "$BACKUP_FILE" .bp | sed 's/[0-9]*$//')
              echo "[restore] backup prefix: $PREFIX"
              # Ensure files copied in are readable by the assigned UID.
              chmod -R a+r "$RESTORE_DIR" || true
              # Wipe live db files; keep virtuoso.ini and the restore dir.
              cd "$DB_DIR"
              rm -f virtuoso.db virtuoso.lck virtuoso.log virtuoso.pxa virtuoso.trx \
                    virtuoso-temp.db virtuoso-temp.trx
              # Move .bp files next to virtuoso.ini. virtuoso-t +restore-backup
              # looks for backup files in CWD; the image's ini also has paths
              # like `../database/...` which only resolve when CWD is /database.
              mv "$RESTORE_DIR"/*.bp "$DB_DIR"/
              /opt/virtuoso-opensource/bin/virtuoso-t \
                +configfile "$DB_DIR/virtuoso.ini" \
                +restore-backup "$PREFIX"
              # Tidy up: remove the now-restored .bp files and the marker.
              rm -f "$DB_DIR"/*.bp
              rm -f "$MARKER"
              echo "[restore] complete"
          volumeMounts:
            - name: data
              mountPath: /database
      {{- end }}
      containers:
        - name: virtuoso
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext: {{- toYaml . | nindent 12 }}
          {{- end }}
          # The upstream entrypoint ends with `exec $GOSU virtuoso virtuoso-t -f`,
          # which drops privileges from root to the `virtuoso` user. Under
          # OpenShift's random non-root UID we can't drop, and the pod dies with
          # `failed switching to "virtuoso": operation not permitted`. We set
          # `GOSU=""` and install a `virtuoso` shim that just forwards its args,
          # so the line collapses to `exec virtuoso-t -f` (and the same trick
          # handles the `$GOSU virtuoso bash <init-script>` path).
          command:
            - /bin/bash
            - -c
            - |
              set -e
              printf '%s\n' '#!/bin/sh' 'exec "$@"' > /tmp/virtuoso
              chmod +x /tmp/virtuoso
              export PATH=/tmp:$PATH
              exec /virtuoso-entrypoint.sh start
          env:
            - name: GOSU
              value: ""
            - name: DBA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "virtuoso.secretName" . }}
                  key: {{ include "virtuoso.dbaPasswordKey" . }}
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: sparql
              containerPort: 8890
          readinessProbe:
            tcpSocket: { port: sparql }
            initialDelaySeconds: 20
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: sparql }
            initialDelaySeconds: 60
            periodSeconds: 15
          {{- if .Values.initScripts }}
          # The image's entrypoint runs initdb.d scripts ONLY when it creates a
          # brand-new database. A crashed first boot or a `restore:` of a backup
          # leaves a database without them (symptom: SPARQL reads work, every
          # update returns 500 — the SPARQL_UPDATE grants are missing). The
          # scripts are idempotent, so re-apply them on every container start.
          # Output goes to the container's stdout (fd of PID 1) so it shows in
          # `kubectl logs`. Always exits 0: a failed postStart would kill the
          # container and mask the real problem.
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/bash
                  - -c
                  - |
                    ISQL=/opt/virtuoso-opensource/bin/isql
                    LOG=/proc/1/fd/1
                    for _ in $(seq 1 150); do
                      if "$ISQL" 1111 dba "$DBA_PASSWORD" exec="status();" >/dev/null 2>&1; then
                        for f in /opt/virtuoso-opensource/initdb.d/*.sql; do
                          [ -e "$f" ] || continue
                          echo "[postStart] re-applying $f" > "$LOG"
                          "$ISQL" 1111 dba "$DBA_PASSWORD" "$f" > "$LOG" 2>&1 || \
                            echo "[postStart] WARNING: $f failed" > "$LOG"
                        done
                        exit 0
                      fi
                      sleep 2
                    done
                    echo "[postStart] WARNING: server not reachable within 300s (wrong DBA password after a foreign restore?); init scripts NOT re-applied" > "$LOG"
                    exit 0
          {{- end }}
          {{- with .Values.resources }}
          resources: {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /database
            {{- if .Values.initScripts }}
            - name: initdb
              mountPath: /opt/virtuoso-opensource/initdb.d
              readOnly: true
            {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "virtuoso.fullname" . }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if .Values.initScripts }}
        - name: initdb
          configMap:
            name: {{ include "virtuoso.fullname" . }}-init
        {{- end }}
